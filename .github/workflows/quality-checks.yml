name: Run Quality Checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - '.github/actions/setup-core-python/**'
      - '.github/actions/setup-app-node/**'
      - '.github/workflows/quality-checks.yml'
      - '.github/workflows/app-test.yml'
      - '.github/workflows/core-test.yml'
      - '.github/workflows/schema-drift.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'core/**'
      - '.github/actions/setup-core-python/**'
      - '.github/actions/setup-app-node/**'
      - '.github/workflows/quality-checks.yml'
      - '.github/workflows/app-test.yml'
      - '.github/workflows/core-test.yml'
      - '.github/workflows/schema-drift.yml'
  workflow_dispatch:

jobs:
  app-quality:
    name: run app quality checks (lint, typecheck, build; node-${{ matrix.node }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.required == false }}
    strategy:
      matrix:
        include:
          - node: '24.x'
            required: true
          - node: '22.13.x'
            required: false
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup app runtime
        uses: ./.github/actions/setup-app-node
        with:
          node-version: ${{ matrix.node }}
          pnpm-version: '10'
          project-dir: app
          install-deps: 'true'

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run build
        run: pnpm build

  core-quality:
    name: run core quality checks (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup core runtime
        uses: ./.github/actions/setup-core-python
        with:
          python-version: '3.11'
          poetry-version: '2.2.1'
          project-dir: core
          with-groups: dev
          install-deps: 'true'

      - name: Run Ruff lint
        run: poetry -C core run ruff check nola tests

      - name: Run Ruff format check
        run: poetry -C core run ruff format --check nola tests

      - name: Run mypy
        run: poetry -C core run mypy nola
