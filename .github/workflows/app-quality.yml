name: Run App Quality Checks (Lint, Typecheck, Build)

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/actions/setup-app-node/**'
      - '.github/workflows/app-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/actions/setup-app-node/**'
      - '.github/workflows/app-quality.yml'
  workflow_dispatch:

jobs:
  app-quality:
    name: run app quality checks (node-${{ matrix.node }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.required == false }}
    strategy:
      matrix:
        include:
          - node: '24.x'
            required: true
          - node: '22.13.x'
            required: false
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup app runtime
        uses: ./.github/actions/setup-app-node
        with:
          node-version: ${{ matrix.node }}
          pnpm-version: '10'
          project-dir: app
          install-deps: 'true'

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run build
        run: pnpm build
