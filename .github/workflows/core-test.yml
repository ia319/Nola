name: Run Core Tests (Pytest)

on:
  workflow_run:
    workflows:
      - Run Quality Checks
    types:
      - completed
  workflow_dispatch:

jobs:
  core-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: run core tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup core runtime
        uses: ./.github/actions/setup-core-python
        with:
          python-version: '3.11'
          poetry-version: '2.2.1'
          project-dir: core
          with-groups: dev
          install-deps: 'true'

      - name: Run pytest
        run: poetry -C core run pytest tests -v --tb=short
