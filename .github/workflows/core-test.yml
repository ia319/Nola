name: Run Core Tests (Pytest)

on:
  pull_request:
    paths:
      - 'core/**'
      - '.github/actions/setup-core-python/**'
      - '.github/workflows/core-test.yml'
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - '.github/actions/setup-core-python/**'
      - '.github/workflows/core-test.yml'
  workflow_dispatch:

jobs:
  core-test:
    name: run core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup core runtime
        uses: ./.github/actions/setup-core-python
        with:
          python-version: '3.11'
          poetry-version: '2.2.1'
          project-dir: core
          with-groups: dev
          install-deps: 'true'

      - name: Run pytest
        run: poetry -C core run pytest tests -v --tb=short
