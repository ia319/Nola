name: Check Schema Drift (OpenAPI Types)

on:
  workflow_run:
    workflows:
      - Run Quality Checks
    types:
      - completed
  workflow_dispatch:

jobs:
  schema-drift:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: check schema drift (openapi types)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup core runtime
        uses: ./.github/actions/setup-core-python
        with:
          python-version: '3.11'
          poetry-version: '2.2.1'
          project-dir: core
          with-groups: dev
          install-deps: 'true'

      - name: Setup app runtime
        uses: ./.github/actions/setup-app-node
        with:
          node-version: '24.x'
          pnpm-version: '10'
          project-dir: app
          install-deps: 'true'

      - name: Start backend
        run: poetry -C core run uvicorn nola.main:app --host 127.0.0.1 --port 8000 &

      - name: Wait backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Backend not ready'
          exit 1

      - name: Regenerate OpenAPI types
        run: pnpm --dir app gen:types

      - name: Check drift
        run: git diff --exit-code -- app/src/shared/types/openapi.d.ts
