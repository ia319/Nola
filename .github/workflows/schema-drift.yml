name: Check Schema Drift (OpenAPI Types)

on:
  pull_request:
    paths:
      - 'core/nola/api/routes/**'
      - 'core/nola/api/schemas/**'
      - 'app/src/shared/types/openapi.d.ts'
      - 'app/package.json'
      - '.github/actions/setup-core-python/**'
      - '.github/actions/setup-app-node/**'
      - '.github/workflows/schema-drift.yml'
  push:
    branches:
      - main
    paths:
      - 'core/nola/api/routes/**'
      - 'core/nola/api/schemas/**'
      - 'app/src/shared/types/openapi.d.ts'
      - 'app/package.json'
      - '.github/actions/setup-core-python/**'
      - '.github/actions/setup-app-node/**'
      - '.github/workflows/schema-drift.yml'
  workflow_dispatch:
jobs:
  schema-drift:
    name: check schema drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup core runtime
        uses: ./.github/actions/setup-core-python
        with:
          python-version: '3.11'
          poetry-version: '2.2.1'
          project-dir: core
          with-groups: dev
          install-deps: 'true'

      - name: Setup app runtime
        uses: ./.github/actions/setup-app-node
        with:
          node-version: '24.x'
          pnpm-version: '10'
          project-dir: app
          install-deps: 'true'

      - name: Start backend
        run: poetry -C core run uvicorn nola.main:app --host 127.0.0.1 --port 8000 &

      - name: Wait backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Backend not ready'
          exit 1

      - name: Regenerate OpenAPI types
        run: pnpm --dir app gen:types

      - name: Check drift
        run: git diff --exit-code -- app/src/shared/types/openapi.d.ts
