name: Schema Drift

on:
  pull_request:
    paths:
      - 'core/nola/api/routes/**'
      - 'core/nola/api/schemas/**'
      - 'app/src/shared/types/openapi.d.ts'
      - 'app/package.json'
      - '.github/workflows/schema-drift.yml'
  workflow_dispatch:

jobs:
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'poetry'
          cache-dependency-path: core/poetry.lock

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: Install core dependencies
        run: poetry -C core install --with dev --no-interaction --no-ansi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install app dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Start backend
        run: poetry -C core run uvicorn nola.main:app --host 127.0.0.1 --port 8000 &

      - name: Wait backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Backend not ready'
          exit 1

      - name: Regenerate OpenAPI types
        run: pnpm --dir app gen:types

      - name: Check drift
        run: git diff --exit-code -- app/src/shared/types/openapi.d.ts

