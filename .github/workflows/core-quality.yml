name: Core Quality

on:
  pull_request:
    paths:
      - 'core/**'
      - '.github/workflows/core-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - '.github/workflows/core-quality.yml'
  workflow_dispatch:

jobs:
  core-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'poetry'
          cache-dependency-path: core/poetry.lock

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: Install dependencies
        run: poetry -C core install --with dev --no-interaction --no-ansi

      - name: Ruff lint
        run: poetry -C core run ruff check nola tests

      - name: Ruff format check
        run: poetry -C core run ruff format --check nola tests

      - name: Mypy
        run: poetry -C core run mypy nola

      - name: Pytest
        run: poetry -C core run pytest tests -v --tb=short

