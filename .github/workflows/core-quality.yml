name: Core Quality

on:
  pull_request:
    paths:
      - 'core/**'
      - '.github/actions/setup-core-python/**'
      - '.github/workflows/core-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - '.github/actions/setup-core-python/**'
      - '.github/workflows/core-quality.yml'
  workflow_dispatch:

jobs:
  core-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup core runtime
        uses: ./.github/actions/setup-core-python
        with:
          python-version: '3.11'
          poetry-version: '2.2.1'
          project-dir: core
          with-groups: dev
          install-deps: 'true'

      - name: Ruff lint
        run: poetry -C core run ruff check nola tests

      - name: Ruff format check
        run: poetry -C core run ruff format --check nola tests

      - name: Mypy
        run: poetry -C core run mypy nola

      - name: Pytest
        run: poetry -C core run pytest tests -v --tb=short
