name: Run App Tests (Vitest)

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/actions/setup-app-node/**'
      - '.github/workflows/app-test.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/actions/setup-app-node/**'
      - '.github/workflows/app-test.yml'
  workflow_dispatch:

jobs:
  app-test:
    name: run app tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup app runtime
        uses: ./.github/actions/setup-app-node
        with:
          node-version: '24.x'
          pnpm-version: '10'
          project-dir: app
          install-deps: 'true'

      - name: Run vitest
        run: pnpm test:ci
