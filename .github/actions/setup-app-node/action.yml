name: Setup App Node

description: Setup Node and pnpm for app, then optionally install dependencies

inputs:
  node-version:
    description: Node.js version for setup-node
    required: false
    default: '24.x'
  pnpm-version:
    description: pnpm version for pnpm/action-setup
    required: false
    default: '10'
  project-dir:
    description: App project directory containing pnpm-lock.yaml
    required: false
    default: 'app'
  install-deps:
    description: Whether to run pnpm install
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.project-dir }}/pnpm-lock.yaml

    - name: Install app dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: pnpm --dir "${{ inputs.project-dir }}" install --frozen-lockfile
