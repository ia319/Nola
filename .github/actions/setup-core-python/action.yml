name: Setup Core Python

description: Setup Python and Poetry for core, then optionally install dependencies

inputs:
  python-version:
    description: Python version for setup-python
    required: false
    default: "3.11"
  poetry-version:
    description: Poetry version to install for deterministic CI behavior
    required: false
    default: "2.2.1"
  project-dir:
    description: Core project directory containing pyproject.toml and poetry.lock
    required: false
    default: "core"
  with-groups:
    description: Poetry dependency groups to install
    required: false
    default: "dev"
  install-deps:
    description: Whether to run poetry install
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.project-dir }}/poetry.lock

    - name: Install Poetry
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "poetry==${{ inputs.poetry-version }}"

    - name: Configure Poetry virtualenv behavior
      shell: bash
      run: |
        poetry -C "${{ inputs.project-dir }}" config virtualenvs.in-project true --local
        poetry -C "${{ inputs.project-dir }}" config installer.max-workers 10 --local

    - name: Cache Poetry and virtualenv
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cache/pypoetry
          ${{ inputs.project-dir }}/.venv
        key: ${{ runner.os }}-py${{ inputs.python-version }}-poetry${{ inputs.poetry-version }}-${{ hashFiles(format('{0}/poetry.lock', inputs.project-dir)) }}
        restore-keys: |
          ${{ runner.os }}-py${{ inputs.python-version }}-poetry${{ inputs.poetry-version }}-

    - name: Install core dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      env:
        POETRY_NO_INTERACTION: "1"
      run: poetry -C "${{ inputs.project-dir }}" install --with "${{ inputs.with-groups }}" --no-ansi
