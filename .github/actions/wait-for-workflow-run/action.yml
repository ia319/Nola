name: Wait For Workflow Run

description: Wait for a workflow run on a commit SHA to complete successfully

inputs:
  event:
    description: Workflow run event filter
    required: false
    default: pull_request
  github-token:
    description: GitHub token with Actions read permission
    required: true
  head-sha:
    description: Commit SHA to match against workflow runs
    required: true
  poll-seconds:
    description: Polling interval in seconds
    required: false
    default: "30"
  repository:
    description: Repository in owner/name form
    required: true
  timeout-minutes:
    description: Maximum wait time in minutes
    required: false
    default: "85"
  workflow-file:
    description: Workflow file name or id
    required: true
  workflow-name:
    description: Human-readable workflow name for logs
    required: false
    default: workflow

outputs:
  run-id:
    description: Matched workflow run id
    value: ${{ steps.wait-for-workflow-run.outputs.run-id }}
  run-url:
    description: Matched workflow run URL
    value: ${{ steps.wait-for-workflow-run.outputs.run-url }}

runs:
  using: composite
  steps:
    - name: Wait for workflow run
      id: wait-for-workflow-run
      shell: bash
      env:
        EVENT: ${{ inputs.event }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        POLL_SECONDS: ${{ inputs.poll-seconds }}
        REPOSITORY: ${{ inputs.repository }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        WORKFLOW_NAME: ${{ inputs.workflow-name }}
      run: |
        node --input-type=module <<'NODE'
        import fs from 'node:fs'

        const event = process.env.EVENT
        const repository = process.env.REPOSITORY
        const token = process.env.GITHUB_TOKEN
        const headSha = process.env.HEAD_SHA
        const workflowFile = process.env.WORKFLOW_FILE
        const workflowName = process.env.WORKFLOW_NAME
        const timeoutMinutes = Number(process.env.TIMEOUT_MINUTES)
        const pollSeconds = Number(process.env.POLL_SECONDS)

        if (!Number.isFinite(timeoutMinutes) || timeoutMinutes <= 0) {
          throw new Error(`Invalid timeout-minutes value: ${process.env.TIMEOUT_MINUTES}`)
        }

        if (!Number.isFinite(pollSeconds) || pollSeconds <= 0) {
          throw new Error(`Invalid poll-seconds value: ${process.env.POLL_SECONDS}`)
        }

        const deadline = Date.now() + timeoutMinutes * 60 * 1000
        const pollMs = pollSeconds * 1000

        function sleep(ms) {
          return new Promise((resolve) => setTimeout(resolve, ms))
        }

        async function fetchWorkflowRun() {
          const url = new URL(
            `https://api.github.com/repos/${repository}/actions/workflows/${workflowFile}/runs`,
          )
          url.searchParams.set('event', event)
          url.searchParams.set('head_sha', headSha)
          url.searchParams.set('per_page', '20')

          const response = await fetch(url, {
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28',
            },
          })

          if (!response.ok) {
            throw new Error(
              `GitHub API request failed: ${response.status} ${response.statusText}`,
            )
          }

          const payload = await response.json()
          const runs = payload.workflow_runs
            .filter((run) => run.head_sha === headSha)
            .sort((left, right) => new Date(right.created_at) - new Date(left.created_at))

          return runs[0]
        }

        while (Date.now() < deadline) {
          const run = await fetchWorkflowRun()

          if (!run) {
            console.log(`Waiting for ${workflowName} run for ${headSha}`)
            await sleep(pollMs)
            continue
          }

          console.log(`${workflowName} run ${run.id}: ${run.status} ${run.conclusion ?? ''}`)

          if (run.status === 'completed') {
            if (run.conclusion === 'success') {
              await fs.promises.appendFile(
                process.env.GITHUB_OUTPUT,
                `run-id=${run.id}\nrun-url=${run.html_url}\n`,
                'utf8',
              )
              process.exit(0)
            }

            throw new Error(`${workflowName} finished with ${run.conclusion}: ${run.html_url}`)
          }

          await sleep(pollMs)
        }

        throw new Error(`Timed out waiting for ${workflowName} for ${headSha}`)
        NODE
