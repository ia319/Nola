repos:
  # Python linting and formatting (core/ only)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^core/
      - id: ruff-format
        files: ^core/

  # Frontend linting and formatting (app/ only)
  - repo: local
    hooks:
      - id: frontend-lint
        name: ESLint (app)
        entry: pnpm --dir app lint
        language: system
        files: ^app/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: frontend-format
        name: Prettier (app)
        entry: pnpm --dir app format:check
        language: system
        files: ^app/src/
        pass_filenames: false
