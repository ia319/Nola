repos:
  # Local helper only. CI workflows remain the source of truth.
  # Python linting and formatting (core/ only)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^core/(nola|tests)/.*\.py$
      - id: ruff-format
        files: ^core/(nola|tests)/.*\.py$

  # Frontend linting and formatting (app/ only)
  - repo: local
    hooks:
      - id: frontend-lint
        name: ESLint (app)
        entry: pnpm --dir app lint
        language: system
        files: ^app/(src/.*\.(ts|tsx)|vite\.config\.ts|eslint\.config\.js)$
        pass_filenames: false
      - id: frontend-format
        name: Prettier (app)
        entry: pnpm --dir app format:check
        language: system
        files: ^app/(src/.*\.(ts|tsx|css)|[^/]+\.(js|ts|json|yml|yaml))$
        pass_filenames: false
      - id: desktop-format-check
        name: Rust format check (desktop)
        entry: pnpm --dir app desktop:format:check
        language: system
        files: ^app/src-tauri/(src/.*\.rs|build\.rs)$
        pass_filenames: false
      - id: desktop-lint
        name: Clippy (desktop)
        entry: pnpm --dir app desktop:lint
        language: system
        files: ^app/src-tauri/(src/.*\.rs|build\.rs|Cargo\.(toml|lock))$
        pass_filenames: false
      - id: frontend-typecheck
        name: TypeScript typecheck (app)
        entry: pnpm --dir app typecheck
        language: system
        files: ^app/(src/.*\.(ts|tsx)|tsconfig(\..*)?\.json|package\.json|pnpm-lock\.yaml|vite\.config\.ts)$
        pass_filenames: false
        stages: [pre-commit]
      - id: backend-typecheck
        name: Mypy (core)
        entry: poetry -C core run mypy nola
        language: system
        files: ^core/(nola/.*\.py|pyproject\.toml|poetry\.lock)$
        pass_filenames: false
        stages: [pre-commit]
