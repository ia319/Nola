repos:
  # Local helper only. CI workflows remain the source of truth.
  # Python linting and formatting (core/ only)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^core/(nola|tests)/.*\.py$
      - id: ruff-format
        files: ^core/(nola|tests)/.*\.py$

  # Frontend linting and formatting (app/ only)
  - repo: local
    hooks:
      - id: frontend-lint
        name: ESLint (app)
        entry: pnpm --dir app lint
        language: system
        files: ^app/(src/.*\.(ts|tsx)|vite\.config\.ts|eslint\.config\.js)$
        pass_filenames: false
      - id: frontend-format
        name: Prettier (app)
        entry: pnpm --dir app format:check
        language: system
        files: ^app/(src/.*\.(ts|tsx|css)|[^/]+\.(js|ts|json|md|yml|yaml))$
        pass_filenames: false
      - id: frontend-typecheck
        name: TypeScript typecheck (app)
        entry: pnpm --dir app typecheck
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
      - id: backend-typecheck
        name: Mypy (core)
        entry: poetry -C core run mypy nola
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
