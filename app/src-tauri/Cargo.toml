[package]
name = "nola_desktop"
version = "0.1.1"
description = "Nola desktop shell"
authors = ["Nola Team"]
license = ""
repository = "https://github.com/ia319/Nola"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nola_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
bytes = "=1.11.1"
futures-util = "=0.3.32"
http-body-util = "=0.1.3"
hyper = { version = "=1.10.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["http1", "server", "tokio"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.10.3", features = [] }
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-native-roots"] }
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
